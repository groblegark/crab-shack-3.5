<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CRAB SHACK 3 — a beach economy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%220%22 y=%2214%22 font-size=%2214%22>🦀</text></svg>">
<style>
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    overscroll-behavior: none;            /* no pull-to-refresh while dragging the town */
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: #10182c;
    background-image: radial-gradient(ellipse at 50% 30%, #1c2a4a 0%, #10182c 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: monospace;
  }
  .bezel {
    position: relative; padding: 14px;
    background: linear-gradient(160deg, #c8f5e4, #8fe3c4 55%, #4ec39a);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.5);
  }
  canvas {
    display: block;
    width: min(92vw, calc(92vh * 256 / 240));
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    background: #000; border-radius: 6px;
    cursor: grab;
  }
  .scan {
    position: absolute; inset: 14px; border-radius: 6px; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="bezel">
    <canvas id="screen" width="256" height="240"></canvas>
    <div class="scan"></div>
  </div>
  <!-- the "upload a save" surface: game.js opens this from the SAVED TOWNS card -->
  <input id="importSave" type="file" accept=".json,application/json"
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">
  <a id="exportSave" style="display:none"></a>
  <script>
    // Fit the screen to any viewport, preferring crisp half-pixel steps.
    // Portrait viewports get a taller 256x288 canvas (the extra rows go to the
    // UI panel - see game.js); landscape/desktop keep the classic 256x240.
    // Layout constants across the game files are consts derived from H at
    // parse time, so a mode flip on rotate reloads the page - the game saves
    // on beforeunload (and every 5s), so nothing is lost.
    (function () {
      const cv = document.getElementById("screen");
      // THE TOWN IS ALREADY AS BIG AS IT CAN GET on a portrait phone, and it is
      // worth writing down why, because the screen looks half empty and the
      // obvious fix does not work. The world band is a FIXED 256x176 (game.js:
      // PANEL_Y) and the canvas already sits at ~96% of the viewport width, so
      // the scale is width-limited. A taller canvas therefore cannot enlarge
      // the town by one pixel - every row it adds goes to the UI panel below.
      //
      // So take rows only as far as the panel can SPEND them, and spending is
      // what game.js was taught to do: the portrait scale falls out of the card
      // width (scaleN is nearest-neighbour, so 3x costs nothing but a cache
      // entry) and the crew strip wraps into as many rows as fit. PANEL_CAP is
      // where that stops paying - a 200-row panel holds 3x cards two rows deep,
      // and past it the card is growing padding again. What is left over
      // belongs to the page background, and always will: the town cannot use it.
      const PANEL_CAP = 376;                       // 176 world + 200 panel
      const phone = () => Math.min(innerWidth, innerHeight) < 620;
      const pad = () => (phone() ? 14 : 60);
      const wScale = () => (innerWidth - pad()) / 256;
      function modeH() {
        if (innerHeight <= innerWidth) return 240;             // landscape/desktop: unchanged
        // A TALL WINDOW IS NOT A PHONE. The extra rows buy thumb-sized targets
        // on a screen you HOLD; on a desktop they only stretch the aspect ratio
        // for nobody, so a portrait-shaped desktop window keeps the classic
        // 288. Ruled by Matt, 2026-08-24, on seeing it.
        if (!phone()) return 288;
        const rows = Math.floor((innerHeight - pad()) / Math.min(wScale(), 4));
        // quantised to 8 rows: a URL bar sliding in must not read as a rotate
        return Math.max(288, Math.min(PANEL_CAP, rows - (rows % 8)));
      }
      const H = modeH();
      cv.height = H;
      window.SCREEN_H = H;                         // ppu.js picks this up
      function fit() {
        let s = Math.min(wScale(), (innerHeight - pad()) / H);
        if (s >= 2) s = Math.floor(s * 2) / 2;     // crisp steps once there's room
        s = Math.max(s, 0.5);
        cv.style.width = Math.round(256 * s) + "px";
        cv.style.height = Math.round(H * s) + "px";
      }
      let flipT = 0;
      function refit() {
        fit();
        clearTimeout(flipT);                       // settle before deciding it's a real rotate
        if (modeH() !== H) flipT = setTimeout(() => { if (modeH() !== H) location.reload(); }, 250);
      }
      addEventListener("resize", refit);
      addEventListener("orientationchange", () => setTimeout(refit, 120));
      if (window.visualViewport) visualViewport.addEventListener("resize", refit);
      fit();
    })();
  </script>
  <!-- the build stamp (generated by tools/mkversion.mjs at each merge); the
       game guards on typeof GAME_BUILD, so a missing file costs only the stamp -->
  <script src="version.js"></script>
  <script src="font.js"></script>
  <script src="ppu.js"></script>
  <script src="sprites.js"></script>
  <script src="crabs.js"></script>
  <script src="cultureways.js"></script>
  <script src="merge.js"></script>
  <!-- the movement kernel (WASM second backend, DEFAULT-ON; ?kernel=off for the JS reference) must
       load before game.js so the pool can back onto its memory -->
  <script src="tools/kernel/kernel-b64.js?v=10b7bd02"></script>
  <script src="game.js"></script>
</body>
</html>
