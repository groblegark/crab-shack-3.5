# crab-science v2 — the general parallel-run substrate.
#
# A RUN is (gitRef SHA, a committed experiment manifest, arm count). The
# manifest (see experiments/*.json) is a JSON array of ARMS; indexed pod i
# runs arms[i] via tools/kube-arm.mjs and banks one ConfigMap receipt.
# Do not hand-edit installs together: use tools/kube.mjs, which validates
# the SHA is pushed, the manifest is committed AT that SHA, sets these
# values, watches, collects, and cleans up (with the karpenter
# scale-down check - stray nodes are real money).
#
# A result quoted from a run should cite: gitRef, the manifest path, and
# the receipt's own verdict line.

repo: https://github.com/groblegark/crab-shack-3.5.git
# Pin the exact commit - never a branch name, so the receipt stays
# reproducible after the branch moves. kube.mjs sets this.
gitRef: 0000000000000000000000000000000000000000

# Clone credential for a PRIVATE repo. Names a Secret in THIS namespace with
# a `token` key (a GitHub PAT / fine-grained token with read access to
# .Values.repo); the clone init container feeds it to git through GIT_ASKPASS,
# so the token never lands in the URL, .git/config, process args, or a
# failed-clone log line. Empty (the default) => anonymous clone, which is what
# the PUBLIC 3.5 tree wants and is byte-for-byte unchanged. CS4's values set
# this because crab-shack-4 is private (Phase 0, plan kd-NO3Y8a4nW4).
gitCredentialSecret: ""

# Repo-relative path of the experiment manifest, committed at gitRef.
manifest: experiments/suite-312.json
# Number of arms in that manifest == Job completions. kube.mjs reads the
# manifest and sets this; a mismatch means idle pods or unrun arms.
arms: 1
# Cap concurrent pods (default: all arms at once). Spend guardrail.
parallelism: null

image:
  # The arm runtime is an artefact THIS repo builds and verifies
  # (.github/workflows/image.yml), pinned to its :sha tag — never a floating
  # upstream tag that can move under a gate. Carries node 26, git, and zig, so
  # an arm can rebuild kernel.wasm rather than trust the committed binary.
  node: ghcr.io/groblegark/crab-shack-toolchain:6d74cac89a2724a9ada3032b325556156386cd2c
  git: alpine/git:2.45.2

# Sized for the MANIFEST's declared resources by kube.mjs (a suite slice is
# ~2 cpu; a matrix arm forks workers and wants 7-8).
resources:
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Job housekeeping. backoffLimit stays LOW: a red arm is a verdict, not a
# flake to burn retries (and money) on.
backoffLimit: 1
ttlSecondsAfterFinished: 86400
activeDeadlineSeconds: 3600

nodeSelector: {}
tolerations: []
