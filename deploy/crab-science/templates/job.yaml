apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: crab-science
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  completions: {{ .Values.arms }}
  parallelism: {{ .Values.parallelism | default .Values.arms }}
  completionMode: Indexed
  # Per-index retry (k8s 1.29+; cluster is 1.31): a flaky arm retries ITSELF
  # instead of one scheduling hiccup torching every other arm's work — three
  # concurrent 20-arm batteries died 13/24-style to provisioning flakes under
  # backoffLimit alone. maxFailedIndexes still bounds a genuinely red run.
  backoffLimitPerIndex: {{ .Values.backoffLimitPerIndex | default 2 }}
  # ...clamped to the arm count: k8s refuses a Job whose maxFailedIndexes
  # exceeds completions, so the bare default 5 made every manifest with
  # fewer than five arms uninstallable — a 1-arm MCP battery or a 2-arm
  # focus run cannot carry the wide-job default. The cap is "how many arms
  # may die", which can never exceed how many arms there are. (Found
  # independently by FIVE forks in one night — slop, E6, E0, version-stamp
  # and the orchestrator — which is how you know it bit everybody. Both
  # ints: a values file may hand us a string.)
  maxFailedIndexes: {{ min (int (.Values.maxFailedIndexes | default 5)) (int .Values.arms) }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crab-science
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Batch arms run to completion or their receipts die with them:
        # karpenter consolidation evicted 8/8 trunk-spike pods mid-train
        # ("Evicted pod: Underutilized") and backoffLimit 1 turned one
        # repack wave into a failed Job. Do-not-disrupt exempts the pod
        # from voluntary consolidation; the pool still scales down the
        # moment the pod completes.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-runner
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: clone
          image: {{ .Values.image.git }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Auth via GIT_ASKPASS: git calls this ONLY when the server
              # demands a credential (a PRIVATE repo). For the public tree
              # GIT_TOKEN is unset and never read, so the clone is unchanged.
              # The token stays out of the URL, .git/config, `ps`, and any
              # failed-clone log line - the URL git prints on error is clean.
              umask 077
              printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) printf x-access-token;; *) printf %s "$GIT_TOKEN";; esac' > /tmp/askpass
              chmod 700 /tmp/askpass
              export GIT_ASKPASS=/tmp/askpass GIT_TERMINAL_PROMPT=0
              git clone --no-checkout --filter=blob:none {{ .Values.repo }} /work
              cd /work
              git checkout --detach {{ .Values.gitRef }}
              echo "science tree: $(git rev-parse HEAD)"
          {{- if .Values.gitCredentialSecret }}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitCredentialSecret }}
                  key: token
          {{- end }}
          volumeMounts:
            - { name: work, mountPath: /work }
      containers:
        - name: arm
          image: {{ .Values.image.node }}
          workingDir: /work
          # One pod = one arm of the committed manifest. tools/kube-arm.mjs
          # picks arms[JOB_COMPLETION_INDEX], runs it, and BANKS THE RECEIPT
          # as a ConfigMap through the API before exiting - stdout on the
          # ephemeral pool dies with the node. See the file's header.
          command: ["node", "tools/kube-arm.mjs"]
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: RELEASE
              value: {{ .Release.Name }}
            - name: MANIFEST
              value: {{ .Values.manifest }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: work, mountPath: /work }
      volumes:
        - name: work
          emptyDir: {}
