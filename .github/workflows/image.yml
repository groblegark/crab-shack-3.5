# Build the CRAB SHACK toolchain image and publish it PUBLICLY to GHCR.
#
# No secrets are configured for this workflow, on purpose. It authenticates
# with the built-in GITHUB_TOKEN and the `packages: write` permission below,
# so a public repo never has to store a registry credential. That is the whole
# reason the image is built here rather than layered on a private base.
name: toolchain image

on:
  push:
    branches: [main]
    paths:
      - 'images/Dockerfile'
      - '.github/workflows/image.yml'
      - 'tools/kernel/build.sh'
  workflow_dispatch:

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Resolve zig from ziglang.org's own index, and take THEIR published
      # shasum. Nothing here hardcodes a version that would rot, and the
      # tarball is verified against upstream's number rather than one somebody
      # typed into a Dockerfile months ago.
      - name: Resolve latest stable zig + its published shasum
        id: zig
        run: |
          set -euo pipefail
          idx=$(curl -fsSL https://ziglang.org/download/index.json)
          ver=$(echo "$idx" | jq -r 'to_entries
            | map(select(.key != "master"))
            | map(.key)
            | sort_by(split(".") | map(tonumber? // 0))
            | last')
          sha=$(echo "$idx" | jq -r --arg v "$ver" '.[$v]["x86_64-linux"].shasum')
          test -n "$ver" && test "$sha" != "null"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"  >> "$GITHUB_OUTPUT"
          echo "resolved zig $ver"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/Dockerfile
          push: true
          build-args: |
            ZIG_VERSION=${{ steps.zig.outputs.version }}
            ZIG_SHA256=${{ steps.zig.outputs.sha256 }}
          tags: |
            ghcr.io/groblegark/crab-shack-toolchain:latest
            ghcr.io/groblegark/crab-shack-toolchain:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/groblegark/crab-shack-3.5
            org.opencontainers.image.description=CRAB SHACK 3.5 toolchain: node 26, git, zig (for the wasm movement kernel)
            org.opencontainers.image.licenses=NOASSERTION

      # The image self-checks in its final RUN layer, but prove the PUSHED
      # artefact too - a tag that cannot rebuild the kernel is not the image
      # this exists for, and "it built" is not the same claim as "it works".
      - name: Verify the pushed image
        run: |
          set -euo pipefail
          img=ghcr.io/groblegark/crab-shack-toolchain:${{ github.sha }}
          docker run --rm "$img" sh -lc 'node --version && git --version && zig version'
